name: Alertas (olas y precios)

on:
  schedule:
    # ─── HORARIOS DE LOS CHEQUEOS ───────────────────────────────────────
    # GitHub usa hora UTC. Argentina = UTC-3, o sea: hora argentina + 3 = hora UTC.
    # Formato: "minuto hora * * *". Uso el minuto 7 (y no el 0) porque GitHub se
    # satura justo a la hora en punto y atrasa los chequeos.
    # Para cambiar un horario, cambiá el segundo número. Para sumar uno, copiá una línea.
    - cron: "7 9 * * *"    # 06:07 hs argentina
    - cron: "7 13 * * *"   # 10:07
    - cron: "7 16 * * *"   # 13:07
    - cron: "7 20 * * *"   # 17:07
    - cron: "7 23 * * *"   # 20:07
  workflow_dispatch:
    inputs:
      siempre:
        description: "1 = mandar mensajes aunque no haya novedades (para probar). 0 = comportamiento normal"
        default: "1"

# Necesario para que el workflow pueda guardar alerta/estado.json en el repo
# (así recuerda qué ya te avisó y no te repite los mensajes).
permissions:
  contents: write

# Evita que dos chequeos corran al mismo tiempo y se pisen el estado
concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Chequear olas, viento y precios
        env:
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SIEMPRE: ${{ inputs.siempre }}
        run: node alerta/alerta.mjs

      # Guarda el estado aunque el paso anterior haya fallado en una de las dos partes
      - name: Guardar estado
        if: always()
        run: |
          if [ -n "$(git status --porcelain alerta/estado.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alerta/estado.json
            git commit -m "Actualizar estado de alertas"
            git push
          fi
